name: Terraform CI

on:
  push:
    branches:
      - main
    paths:
      - terraform/**
      - lambda/**
      - .github/workflows/terraform.yml

  pull_request:
    branches:
      - main
    paths:
      - terraform/**
      - lambda/**
      - .github/workflows/terraform.yml

jobs:
  terraform:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4

        with:
          role-to-assume: arn:aws:iam::941141115076:role/github-actions-terraform
          aws-region: us-east-1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Build Lambda Package
        working-directory: lambda
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan
